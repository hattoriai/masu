name: Bug report
description: Something in Masu does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem goes to a private report instead (see SECURITY.md).

  - type: input
    id: masu
    attributes:
      label: Masu version
      description: From `mix.lock`, or `mix deps | grep masu`.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Elixir, OTP, Phoenix and LiveView versions
      placeholder: "Elixir 1.20.1, OTP 29, Phoenix 1.8.1, LiveView 1.1.14"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - A list (Masu.Source.List)
        - Ecto
        - A source of my own
        - Not about a source
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database and adapter
      description: For an Ecto source.
      placeholder: "PostgreSQL 16, postgrex 0.21"

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: For what the browser shows or does.
      placeholder: "Safari 26, macOS 26"

  - type: textarea
    id: repro
    attributes:
      label: The smallest grid that shows it
      description: The `<.data_grid>`, its source and columns, or a link to a small repository.
      render: elixir
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Sort by "City"
        2. Filter "Status" to "Active"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error and its stacktrace, from the server log or the browser console.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use a release from Hex, not `main`.
          required: true
        - label: I searched the open and closed issues.
          required: true
