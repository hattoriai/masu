# The databases of `MASU_DB=postgres mix test` and `MASU_DB=mysql mix test`,
# at the ports and passwords that MasuTest.DB uses by default. The tests
# make their own databases.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
